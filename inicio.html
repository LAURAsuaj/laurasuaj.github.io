<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inicio</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            text-align: center;
            padding-top: 100px;
        }

        .contenedor {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #1877f2;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Bienvenido</h1>

    <p id="usuario"></p>

    <button onclick="cerrarSesion()">
        Cerrar sesión
    </button>

</div>


<script type="module">

    import {
        auth,
        signOut,
      
    } from "./firebase.js";



    window.cerrarSesion = async function() {

        await signOut(auth);

        window.location.href = "index.html";

    };

</script>

</body>

</html>
